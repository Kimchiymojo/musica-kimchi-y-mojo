<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: transparent;
  font-family: Arial, sans-serif;
}

body {
  padding: 3px;
}

/* CAJA PRINCIPAL */
.player {
  width: 100%;
  max-width: 270px;
  margin: 0 auto;
  padding: 11px 12px 10px;
  background: #fffaf0;
  border: 1px solid #e7bd45;
  border-radius: 18px;
  text-align: center;
  box-shadow: 0 3px 10px rgba(0,0,0,0.07);
}

/* CHIBI AMI */
.ami {
  width: 105px;
  height: auto;
  display: block;
  margin: -2px auto 1px;
}

/* TÍTULO */
.title {
  margin: 1px 0 2px;
  color: #b51bb5;
  font-size: 15px;
  line-height: 1.2;
  font-weight: 700;
}

.korean {
  margin: 2px 0 8px;
  color: #d34ca8;
  font-size: 10px;
}

/* CANCIÓN ACTUAL */
.now-playing {
  margin: 6px 0 8px;
  color: #a72caf;
  font-size: 17px;
  line-height: 1.2;
  font-weight: 700;
}

/* AUDIO */
audio {
  display: block;
  width: 100%;
  height: 40px;
  margin: 0 auto;
}

/* BOTONES */
.controls {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin: 10px 0 11px;
}

.control-button {
  width: 43px;
  height: 43px;
  border: 1px solid #e1b4dc;
  border-radius: 50%;
  background: #fff;
  color: #b51bb5;
  font-size: 17px;
  cursor: pointer;
  box-shadow: 0 2px 5px rgba(0,0,0,0.06);
  transition: all 0.2s ease;
}

.control-button:hover {
  background: #fbe8f8;
  transform: scale(1.06);
}

/* CABECERA PLAYLIST */
.playlist-title {
  margin: 3px 0 5px;
  padding-bottom: 5px;
  border-bottom: 1px solid #efd8ea;
  color: #b54aaa;
  font-size: 10px;
  text-align: left;
}

/* LISTA */
.playlist {
  width: 100%;
  text-align: left;
}

/* CANCIONES */
.song {
  position: relative;
  margin: 1px 0;
  padding: 4px 7px 4px 22px;
  border-radius: 8px;
  color: #a823a8;
  font-size: 11px;
  line-height: 1.3;
  cursor: pointer;
  transition: all 0.18s ease;
}

.song::before {
  content: "♫";
  position: absolute;
  left: 7px;
  color: #c149bb;
}

.song:hover {
  background: #fff0fb;
  padding-left: 24px;
}

/* CANCIÓN ACTIVA */
.song.active {
  background: linear-gradient(
    90deg,
    #f6dcf3 0%,
    #fff1fa 100%
  );
  color: #861486;
  font-weight: 700;
}

.song.active::before {
  content: "▶";
  font-size: 9px;
  top: 5px;
  color: #b51bb5;
}

/* PIE */
.footer {
  margin-top: 7px;
  padding-top: 6px;
  border-top: 1px solid #f1e1ed;
  color: #b16aae;
  font-size: 8px;
}
</style>
</head>

<body>

<div class="player">

  <img
    class="ami"
    src="chibi-ami-musica.png"
    alt="Chibi Ami DJ">

  <div class="title">
    Música de Kimchi y Mojo
  </div>

  <div class="korean">
    김치와 모호의 음악
  </div>

  <div id="nowPlaying" class="now-playing">
    🎵 Tu primera Mirada
  </div>

  <audio
    id="audioPlayer"
    controls
    controlsList="nodownload"
    oncontextmenu="return false;"
    preload="metadata">
  </audio>

  <div class="controls">

    <button
      class="control-button"
      id="previousButton"
      type="button"
      title="Canción anterior">
      ◀◀
    </button>

    <button
      class="control-button"
      id="nextButton"
      type="button"
      title="Canción siguiente">
      ▶▶
    </button>

  </div>

  <div class="playlist-title">
    ♫ MI PLAYLIST · 9 CANCIONES
  </div>

  <div id="playlist" class="playlist"></div>

  <div class="footer">
    ♫ Corea con mojo · Canarias con kimchi ♡
  </div>

</div>


<script>

const songs = [

  {
    title: "Bajo el Qín",
    file: "Bajo el Qín.mp3"
  },

  {
    title: "Puente de Jade",
    file: "Puente de Jade.mp3"
  },

  {
    title: "Puente de Luz",
    file: "Puente de Luz.mp3"
  },

  {
    title: "Puente de Seda",
    file: "Puente de Seda.mp3"
  },

  {
    title: "Tu primera Mirada",
    file: "Tu primera Mirada.mp3"
  },

  {
    title: "Hilo Quebrado",
    file: "Hilo Quebrado.mp3"
  },

  {
    title: "Hilo de amor roto",
    file: "Hilo de amor roto.mp3"
  },

  {
    title: "Mariposas de Jade",
    file: "Mariposas de Jade.mp3"
  },

  {
    title: "Mariposas en el corazón",
    file: "Mariposas en el corazon.mp3"
  }

];


const audio =
  document.getElementById("audioPlayer");

const nowPlaying =
  document.getElementById("nowPlaying");

const playlist =
  document.getElementById("playlist");

const previousButton =
  document.getElementById("previousButton");

const nextButton =
  document.getElementById("nextButton");


let currentSong = 4;


/* CREAR LISTA */

songs.forEach((song, index) => {

  const item =
    document.createElement("div");

  item.className = "song";

  item.dataset.index = index;

  item.textContent = song.title;

  item.addEventListener(
    "click",
    function() {
      loadSong(index, true);
    }
  );

  playlist.appendChild(item);

});


/* MARCAR CANCIÓN */

function updatePlaylist() {

  const items =
    document.querySelectorAll(".song");

  items.forEach((item, index) => {

    if (index === currentSong) {

      item.classList.add("active");

    } else {

      item.classList.remove("active");

    }

  });

}


/* CARGAR CANCIÓN */

function loadSong(index, autoplay) {

  currentSong = index;

  audio.src =
    encodeURI(songs[index].file);

  nowPlaying.textContent =
    "🎵 " + songs[index].title;

  updatePlaylist();

  audio.load();

  if (autoplay) {

    audio.play().catch(function() {
      /* El navegador puede bloquear autoplay */
    });

  }

}


/* ANTERIOR */

previousButton.addEventListener(
  "click",
  function() {

    let previous =
      currentSong - 1;

    if (previous < 0) {
      previous = songs.length - 1;
    }

    loadSong(previous, true);

  }
);


/* SIGUIENTE */

nextButton.addEventListener(
  "click",
  function() {

    let next =
      currentSong + 1;

    if (next >= songs.length) {
      next = 0;
    }

    loadSong(next, true);

  }
);


/* AL TERMINAR → SIGUIENTE */

audio.addEventListener(
  "ended",
  function() {

    let next =
      currentSong + 1;

    if (next >= songs.length) {
      next = 0;
    }

    loadSong(next, true);

  }
);


/* INICIO */

loadSong(currentSong, false);

</script>

</body>
</html>
