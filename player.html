<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: transparent;
  font-family: Arial, sans-serif;
}

.player {
  width: 100%;
  max-width: 270px;
  margin: 0 auto;
  padding: 14px 12px 12px;
  background: #fffaf0;
  border: 1px solid #e7bd45;
  border-radius: 17px;
  text-align: center;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

/* CHIBI AMI */
.ami {
  width: 120px;
  height: auto;
  display: block;
  margin: 0 auto 3px;
}

/* TÍTULOS */
.title {
  margin: 2px 0;
  color: #b51bb5;
  font-size: 16px;
  font-weight: bold;
}

.korean {
  margin: 3px 0 11px;
  color: #d34ca8;
  font-size: 11px;
}

/* CANCIÓN ACTUAL */
.now-playing {
  margin: 7px 0 10px;
  color: #a62aad;
  font-size: 18px;
  line-height: 1.25;
  font-weight: bold;
}

/* AUDIO */
audio {
  display: block;
  width: 100%;
  height: 42px;
  margin: 0 auto;
}

/* BOTONES */
.controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 13px 0 12px;
}

.control-button {
  width: 46px;
  height: 42px;
  border: 1px solid #999;
  border-radius: 6px;
  background: #ffffff;
  color: #b51bb5;
  font-size: 18px;
  cursor: pointer;
}

.control-button:hover {
  background: #fbeafb;
}

/* PLAYLIST */
.playlist-title {
  margin: 4px 0 6px;
  color: #a62aad;
  font-size: 12px;
  font-weight: bold;
  text-align: left;
}

.playlist {
  max-height: 205px;
  overflow-y: auto;
  padding: 5px 3px;
  border-top: 1px solid #efd8ea;
  border-bottom: 1px solid #efd8ea;
  text-align: left;
  scrollbar-width: thin;
}

.song {
  padding: 6px 7px;
  margin: 1px 0;
  border-radius: 7px;
  color: #a823a8;
  font-size: 12px;
  line-height: 1.25;
  cursor: pointer;
  transition: 0.2s;
}

.song:hover {
  background: #fff0fb;
}

.song.active {
  background: #f4dff3;
  color: #861486;
  font-weight: bold;
}

/* PIE */
.footer {
  margin-top: 10px;
  color: #b16aae;
  font-size: 9px;
}
</style>
</head>

<body>

<div class="player">

  <!-- CHIBI AMI -->
  <img
    class="ami"
    src="chibi-ami-musica.png"
    alt="Chibi Ami DJ">

  <!-- NOMBRE -->
  <div class="title">
    Música de Kimchi y Mojo
  </div>

  <div class="korean">
    김치와 모호의 음악
  </div>

  <!-- CANCIÓN ACTUAL -->
  <div id="nowPlaying" class="now-playing">
    🎵 Tu primera Mirada
  </div>

  <!-- AUDIO -->
  <audio
    id="audioPlayer"
    controls
    controlsList="nodownload"
    oncontextmenu="return false;"
    preload="metadata">
  </audio>

  <!-- CONTROLES -->
  <div class="controls">
    <button
      class="control-button"
      id="previousButton"
      type="button"
      title="Anterior">
      ⏮
    </button>

    <button
      class="control-button"
      id="nextButton"
      type="button"
      title="Siguiente">
      ⏭
    </button>
  </div>

  <!-- PLAYLIST -->
  <div class="playlist-title">
    🎶 Playlist · 9 canciones
  </div>

  <div id="playlist" class="playlist"></div>

  <!-- PIE -->
  <div class="footer">
    ♫ Corea con mojo, Canarias con kimchi ♡
  </div>

</div>


<script>
const songs = [
  {
    title: "Bajo el Qín",
    file: "Bajo el Qín.mp3"
  },
  {
    title: "Puente de Jade",
    file: "Puente de Jade.mp3"
  },
  {
    title: "Puente de Luz",
    file: "Puente de Luz.mp3"
  },
  {
    title: "Puente de Seda",
    file: "Puente de Seda.mp3"
  },
  {
    title: "Tu primera Mirada",
    file: "Tu primera Mirada.mp3"
  },
  {
    title: "Hilo Quebrado",
    file: "Hilo Quebrado.mp3"
  },
  {
    title: "Hilo de amor roto",
    file: "Hilo de amor roto.mp3"
  },
  {
    title: "Mariposas de Jade",
    file: "Mariposas de Jade.mp3"
  },
  {
    title: "Mariposas en el corazón",
    file: "Mariposas en el corazon.mp3"
  }
];

const audio = document.getElementById("audioPlayer");
const nowPlaying = document.getElementById("nowPlaying");
const playlist = document.getElementById("playlist");
const previousButton = document.getElementById("previousButton");
const nextButton = document.getElementById("nextButton");

let currentSong = 4;


/* CREAR PLAYLIST */
songs.forEach((song, index) => {

  const item = document.createElement("div");

  item.className = "song";
  item.dataset.index = index;
  item.textContent = "♫ " + song.title;

  item.addEventListener("click", () => {
    loadSong(index, true);
  });

  playlist.appendChild(item);
});


/* ACTUALIZAR CANCIÓN ACTIVA */
function updatePlaylist() {

  const items = document.querySelectorAll(".song");

  items.forEach((item, index) => {

    if (index === currentSong) {

      item.classList.add("active");
      item.textContent =
        "▶ " + songs[index].title;

      item.scrollIntoView({
        block: "nearest",
        behavior: "smooth"
      });

    } else {

      item.classList.remove("active");
      item.textContent =
        "♫ " + songs[index].title;

    }

  });
}


/* CARGAR CANCIÓN */
function loadSong(index, autoplay = false) {

  currentSong = index;

  audio.src =
    encodeURI(songs[index].file);

  nowPlaying.textContent =
    "🎵 " + songs[index].title;

  updatePlaylist();

  audio.load();

  if (autoplay) {

    audio.play().catch(() => {
      /* Algunos navegadores pueden bloquear
         la reproducción automática */
    });

  }
}


/* ANTERIOR */
previousButton.addEventListener("click", () => {

  let previous = currentSong - 1;

  if (previous < 0) {
    previous = songs.length - 1;
  }

  loadSong(previous, true);

});


/* SIGUIENTE */
nextButton.addEventListener("click", () => {

  let next = currentSong + 1;

  if (next >= songs.length) {
    next = 0;
  }

  loadSong(next, true);

});


/* PASAR AUTOMÁTICAMENTE A LA SIGUIENTE */
audio.addEventListener("ended", () => {

  let next = currentSong + 1;

  if (next >= songs.length) {
    next = 0;
  }

  loadSong(next, true);

});


/* CARGA INICIAL */
loadSong(currentSong, false);
</script>

</body>
</html>
